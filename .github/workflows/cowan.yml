name: Build Cowan binaries

# Build the Cowan binaries on each supported platform, and fuse the two macOS
# builds into universal binaries. Extract the cowan-darwin, cowan-linux-x86_64,
# and cowan-windows-x86_64 archives into src/crispy/quanty/parameters/cowan/bin
# and commit them.

on:
  workflow_dispatch:

jobs:
  build-unix:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # make install uses bin/darwin for both macOS architectures.
          - runner: macos-15
            platform: darwin-arm64
            folder: darwin
          - runner: macos-15-intel
            platform: darwin-x86_64
            folder: darwin
          - runner: ubuntu-latest
            platform: linux-x86_64
            folder: linux-x86_64
    defaults:
      run:
        working-directory: src/crispy/quanty/parameters/cowan
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gfortran (Linux)
        # cowan-parameters imports Qt, which needs libegl1.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libegl1
          echo "FC=gfortran" >> "$GITHUB_ENV"

      - name: Install gfortran (macOS)
        # Homebrew installs gfortran with a version suffix, for example gfortran-15.
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "FC=$(ls "$(brew --prefix gcc)"/bin/gfortran-[0-9]* | head -n 1)" >> "$GITHUB_ENV"

      - name: Build the binaries
        run: make install FC="$FC"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run cowan-parameters with the new binaries
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ github.workspace }}"
          cowan-parameters -e Fe -c 2p5,3d6

      - name: Archive the binaries
        # tar keeps the executable bits, which upload-artifact drops. Crispy uses
        # only rcn and rcn2.
        run: |
          tar -cpzf "cowan-${{ matrix.platform }}.tar.gz" -C bin \
            "${{ matrix.folder }}/rcn" "${{ matrix.folder }}/rcn2"

      - name: Upload the binaries
        uses: actions/upload-artifact@v6
        with:
          name: cowan-${{ matrix.platform }}
          path: src/crispy/quanty/parameters/cowan/cowan-${{ matrix.platform }}.tar.gz

  fuse-macos:
    name: Fuse the macOS binaries
    needs: build-unix
    runs-on: macos-15
    steps:
      - name: Download the macOS binaries
        uses: actions/download-artifact@v6
        with:
          pattern: cowan-darwin-*

      - name: Fuse the arm64 and x86_64 binaries
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "$arch"
            tar -xpzf "cowan-darwin-$arch/cowan-darwin-$arch.tar.gz" -C "$arch"
          done
          mkdir -p darwin
          for program in rcn rcn2; do
            lipo -create "arm64/darwin/$program" "x86_64/darwin/$program" \
              -output "darwin/$program"
            chmod 755 "darwin/$program"
            lipo "darwin/$program" -verify_arch arm64
            lipo "darwin/$program" -verify_arch x86_64
          done
          tar -cpzf cowan-darwin.tar.gz darwin/rcn darwin/rcn2

      - name: Upload the universal binaries
        uses: actions/upload-artifact@v6
        with:
          name: cowan-darwin
          path: cowan-darwin.tar.gz

  build-windows:
    name: Build (windows-x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 with gfortran
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make patch curl tar mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Build the binaries
        shell: msys2 {0}
        run: |
          cd src/crispy/quanty/parameters/cowan
          make install

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run cowan-parameters with the new binaries
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ github.workspace }}"
          cowan-parameters -e Fe -c 2p5,3d6

      - name: Archive the binaries
        shell: msys2 {0}
        run: |
          cd src/crispy/quanty/parameters/cowan
          tar -cpzf cowan-windows-x86_64.tar.gz -C bin \
            windows-x86_64/rcn.exe windows-x86_64/rcn2.exe

      - name: Upload the binaries
        uses: actions/upload-artifact@v6
        with:
          name: cowan-windows-x86_64
          path: src/crispy/quanty/parameters/cowan/cowan-windows-x86_64.tar.gz
